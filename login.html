<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Codeverse Weather Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <nav class="nav">
        <a href="#" class="logo">codeverse</a>
        <ul class="nav-links">
            <li><a href="login.html">Home</a></li>
            <li><a href="#footer">Bottom</a></li>
        </ul>
        <div class="icon" title="Notifications">
            <img src="Bell_Icon.jpeg" alt="Notification" style="border-radius:50%;">
        </div>
    </nav>

    <section class="login">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="box">
            <h2 class="title">Welcome Back</h2>
            <p class="subtitle">login to continue</p>
            <div class="input-group">
                <input type="text" placeholder="Username" title="username required" required>
            </div>
            <div class="input-group password-group">
                <input type="password" placeholder="Password" title="password required" required>
                <div class="showicon" title="Show password"></div>
            </div>
            <button>Login</button>
            <p class="forgot">Forgot Password?</p>
            <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
        </div>
        <p id="footer" class="footer">© 2026 Codeverse. All rights reserved.</p>
    </section>
</body>

</html>
