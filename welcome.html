<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Codeverse Weather Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <style>
        .welcome-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 16px auto;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .status-badge {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
        }

        .btn-portal {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3) !important;
            margin-bottom: 12px;
        }

        .btn-portal:hover {
            background: linear-gradient(135deg, #059669, #047857) !important;
            box-shadow: 0 12px 25px rgba(16, 185, 129, 0.5) !important;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2) !important;
            border: 1px solid rgba(239, 68, 68, 0.4) !important;
            color: #fca5a5 !important;
            box-shadow: none !important;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.35) !important;
        }
    </style>
</head>

<body>
    <nav class="nav">
        <a href="welcome.html" class="logo">codeverse</a>
        <ul class="nav-links">
            <li><a href="india_weather.html">Weather DBMS</a></li>
            <li><a href="index.html">Quick Search</a></li>
        </ul>
        <div class="icon" title="Notifications">
            <img src="Bell_Icon.jpeg" alt="Notification">
        </div>
    </nav>

    <section class="login">
        <div class="circle1"></div>
        <div class="circle2"></div>

        <div class="box" style="text-align: center;">
            <div class="welcome-avatar">👤</div>
            <h2 class="title" id="welcomeTitle">Welcome Back</h2>
            <div class="status-badge">Authenticated & Connected</div>
            
            <p style="margin-bottom: 24px; color: rgba(255,255,255,0.75); font-size: 0.95rem;">
                Access live weather telemetry, interactive vector maps, and location database management.
            </p>

            <button id="enterAppBtn" class="btn-portal">🌤️ Open Weather DBMS Portal</button>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>

        <p id="footer" class="footer">© 2026 Codeverse. All rights reserved.</p>
    </section>
</body>

</html>
